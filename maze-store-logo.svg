<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <title>Maze Store</title>
  <!-- Maze Store: an app grid in the Maze family's square-frame language.
       Three empty frames are the catalogue; the fourth is solid, lit, and
       carries the download arrow — the app you are getting. Black and white. -->
  <defs>
    <radialGradient id="ms-glow" cx="666" cy="666" r="340" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.30"/>
      <stop offset="0.45" stop-color="#ffffff" stop-opacity="0.07"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="ms-lit" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#cfcfd8"/>
    </linearGradient>
  </defs>
  <rect width="1024" height="1024" rx="220" fill="#000"/>
  <circle cx="666" cy="666" r="340" fill="url(#ms-glow)"/>
  <g fill="none" stroke="#f2f2f4" stroke-width="46" stroke-linejoin="miter">
    <rect x="245" y="245" width="207" height="207"/>
    <rect x="572" y="245" width="207" height="207"/>
    <rect x="245" y="572" width="207" height="207"/>
  </g>
  <rect x="549" y="549" width="253" height="253" fill="url(#ms-lit)"/>
  <g fill="none" stroke="#000" stroke-width="44" stroke-linecap="butt" stroke-linejoin="miter">
    <path d="M675.5 600 V722"/>
    <path d="M621 668 L675.5 722.5 L730 668"/>
    <path d="M613 758 H738"/>
  </g>
</svg>
